name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/FieldLockPlugin.csproj

      - name: Build (Release)
        run: dotnet build src/FieldLockPlugin.csproj -c Release --no-restore

      - name: Locate build output
        id: locate
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path "src/bin/Release" -Filter "FieldLockPlugin.dll" -Recurse | Select-Object -First 1
          if (-not $dll) {
            throw "FieldLockPlugin.dll not found in build output."
          }
          echo "dll_path=$($dll.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FieldLockPlugin-dll
          path: ${{ steps.locate.outputs.dll_path }}

      - name: Create release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: v1.0.${{ github.run_number }}
          files: ${{ steps.locate.outputs.dll_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
